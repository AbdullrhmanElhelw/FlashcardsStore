<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="100%" height="100%">
  <defs>
    <!-- Card Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6E5"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B88E23"/>
      <stop offset="100%" stop-color="#8D6711"/>
    </linearGradient>
    <!-- Header Theme Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#120314"/>
    </linearGradient>
    <!-- Lamination Sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="440" height="300" fill="#FAF8F5"/>

  <!-- Main Physical Card Stock with Beveled Corners &amp; Shadow -->
  <rect x="15" y="15" width="410" height="270" rx="20" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Inner Gold Border (Embossed Foil Trim) -->
  <rect x="22" y="22" width="396" height="256" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Top Header Banner (Subject &amp; Academy) -->
  <path d="M 23,37 A 14,14 0 0 1 37,23 L 403,23 A 14,14 0 0 1 417,37 L 417,70 L 23,70 Z" fill="url(#headerGrad)"/>
  
  <!-- Category Pill Badge -->
  <rect x="35" y="33" width="95" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="82" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FBF6E5" text-anchor="middle" letter-spacing="1">GRAMMAR</text>

  <!-- Card Count Badge -->
  <text x="395" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#D4AF37" text-anchor="end" letter-spacing="0.5">72 CARDS</text>

  <!-- Sub Header Indicator -->
  <text x="220" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#8D6711" text-anchor="middle" letter-spacing="1.5">ENGLISH VERB TENSES</text>

  <!-- Core Content Display Box -->
  <rect x="40" y="104" width="360" height="74" rx="14" fill="#FAF7F2" stroke="#E6DFD5" stroke-width="1"/>

  <!-- Big Core Letter / Rule -->
  <text x="220" y="148" font-family="'Cairo', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#064E3B" text-anchor="middle">PAST - PRESENT - FUTURE</text>
  <text x="220" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#B88E23" text-anchor="middle">Regular &amp; Irregular Verb Conjugation</text>

  <!-- Example Word Family Pills -->
  <g transform="translate(35, 192)">
    <rect x="5" y="0" width="82" height="32" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.2"/>
    <text x="46" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1E1220" text-anchor="middle">played</text>

    <rect x="95" y="0" width="82" height="32" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.2"/>
    <text x="136" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1E1220" text-anchor="middle">plays</text>

    <rect x="185" y="0" width="82" height="32" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.2"/>
    <text x="226" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1E1220" text-anchor="middle">will play</text>

    <rect x="275" y="0" width="88" height="32" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.2"/>
    <text x="319" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1E1220" text-anchor="middle">eating</text>
  </g>

  <!-- Bottom Academy Brand Watermark -->
  <line x1="40" y1="242" x2="400" y2="242" stroke="#E6DFD5" stroke-width="1"/>
  <text x="40" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#8C7B8E">KHOLOUD ELNADY ACADEMY &#8226; 350 GSM</text>
  <text x="400" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#B88E23" text-anchor="end" letter-spacing="0.5">OFFICIAL FLASHCARDS</text>

  <!-- Sheen Reflection Overlay -->
  <path d="M 23,23 L 200,23 L 23,200 Z" fill="url(#sheen)" pointer-events="none"/>
</svg>